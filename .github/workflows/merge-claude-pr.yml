# Pirate Force - merge a cloud chief's pull request when the gate is green,
# and CLOSE it when the gate is red, so that an open PR can be used as a lock
# WITHOUT that lock ever becoming permanent.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS.  Panya's ruling of 2026-08-20 ~20:35 ("A-double-prime"):
# a cloud chief running in a Claude Code Routine cannot push `main` - the refusal
# happens at the sandbox layer, before GitHub is ever reached, and no prompt can
# override it - and every session gets a NEWLY RANDOMISED branch name, so there
# is no fixed ref for two rounds to race on.  Both of the mechanisms this project
# built the same day therefore died: fast-forwarding `main` from a cloud round
# (A-prime), and the tracked lock file `pf_bridge/cloud_round_lock.json`, which
# was won by pushing and so could never be won at all.
#
# What a cloud round CAN do was measured on 2026-08-20 by rounds 110 and 111:
# push its own `claude/*` branch, open a pull request, and read the GitHub API.
# So the lock becomes: AN OPEN `claude/*` PULL REQUEST IS THE LOCK.  A round that
# finds one ends immediately; a round that finds none may work.
#
# ---------------------------------------------------------------------------
# THE FAILURE THIS FILE EXISTS TO PREVENT.  Panya asked it herself, and it is the
# only serious objection to the design: if a PR is open and its gate is RED, the
# lock never releases, every later round ends on sight, forever - and a later
# round cannot even repair the PR, because it can only push to its OWN branch.
#
# The answer is that NO CLOUD ROUND IS EVER ASKED TO CLEAN THIS UP.  GitHub does
# it, here, with GITHUB_TOKEN, on the runner.  THE INVARIANT THIS FILE OWES:
#
#   *** NO PATH THROUGH EITHER JOB MAY END WITH AN ELIGIBLE PR STILL OPEN,
#       EXCEPT ONE: A HEAD THAT MOVED, AND ONLY WHILE THE PR IS YOUNGER THAN
#       PF_STALE_HOURS. ***
#
# THE ONE EXCEPTION, stated here so the rule and the code agree (R219,
# 2026-08-29).  When the merge is refused because the head moved between the
# decision and the call, the pull request is LEFT OPEN.  Discharge obligation:
# the new head gets a gate run of its own, which wakes `decide` again; `finish`
# sweeps every open PR on every workflow_run; and past PF_STALE_HOURS this same
# skip stops applying, so the close path takes it.  The bound is enforced in
# code at the skip site - if you remove the age test, you remove the invariant.
# Why the exception exists: closing on a moved head threw away a GREEN round
# (#218, measured; see the comment at the skip site), and a moved head is the
# same condition as the `HEAD_SHA != SHA` check that already skips, only noticed
# a few seconds later.
#
# Otherwise: an eligible PR ends merged, or closed with a comment saying why.
# If merging fails for any other reason - a 403, an API error - it is CLOSED.
# Closing is never the loss it looks like: the branch is kept, deliberately, and
# the comment names it.  What is thrown away is the LOCK, which is the only
# thing here that must never get stuck.
#
# A first draft of this file broke that invariant in four places, all found by
# review before it ever ran: a green-gate-but-still-open case that only logged a
# warning and left the lock held forever; a `gh pr merge` failure that killed the
# script under `set -e` with the PR still open; `|| true` turning an API outage
# into a cheerful "nothing to do"; and the reaper reading a green run and
# declining to act on it.  They are listed because the shape of that mistake -
# an escape hatch that reports rather than acts - will look reasonable again.
#
# ---------------------------------------------------------------------------
# WHOSE VERDICT IS READ.  The conclusion of the JOB NAMED `gate`, never the
# conclusion of the workflow run.  gate-windows.yml has a second job,
# `publish-status`, which runs `if: always()` and can fail on its own (it pushes
# to a branch and gives up after three lost races).  The WORKFLOW conclusion
# would then be `failure` while the gate itself was green, and this file would
# close a good pull request and comment that the gate was red - a lie told
# confidently, which is the worst kind this project can produce.
#
# ---------------------------------------------------------------------------
# WHY NOT GITHUB'S BUILT-IN AUTO-MERGE.  Because it is not known to be available
# here.  Auto-merge is only useful behind branch protection with required status
# checks, and whether a PRIVATE repository on a PERSONAL account can have those
# is a repository setting nobody in this project has looked at.  Panya's note
# forbids writing "turn on auto-merge" and calling that a plan.  This workflow
# merges through the API instead: no branch protection, no plan tier, no
# visibility requirement, only the two job-level permissions declared below.
#
# That elevation is not a guess.  `publish-status` in gate-windows.yml raises
# itself to `contents: write` by exactly this mechanism, on exactly this
# repository, and the `ci-status` branch it pushes was confirmed to exist on
# 2026-08-20 (cloud round 111 read `conclusion: success` out of it).  So
# `contents: write` is MEASURED here.  `pull-requests: write` is the same
# mechanism with a different scope and has NOT been measured; if the settings
# refuse it, the first run fails with HTTP 403 - loudly, having changed nothing.
# That is the one number to look at on the first run.
#
# ---------------------------------------------------------------------------
# OPT-IN BY CONSTRUCTION.  Every pull request whose body lacks the marker line
# PF_MARKER is ignored.  Two pull requests are open right now (#1 and #2, from
# cloud rounds 110 and 111) that predate this file and do not carry the marker,
# so installing this file cannot suddenly merge them behind Panya's back.  Same
# house pattern as every hypothesis in this project: opt-in, and fail closed.
#
# WHAT THIS FILE STILL CANNOT DO.  If Actions itself is disabled, out of minutes,
# or broken, neither job runs, the reaper does not fire, and an open PR stays a
# lock nobody can clear.  There is no way around that from inside Actions, and
# the escape hatch is a human closing one PR on the day CI is dead.  Said out
# loud rather than papered over, because an earlier draft claimed this case was
# covered and it never was.
#
# ASCII only, on purpose, like every other file in this pipeline.
# ---------------------------------------------------------------------------

name: merge-claude-pr

on:
  # The gate finished.  workflow_run always uses the DEFAULT BRANCH copy of this
  # file, whichever branch the gate ran on, which is what makes it safe: a pull
  # request cannot edit the workflow that decides whether to merge it.  That is
  # the whole reason this is workflow_run and not pull_request.
  workflow_run:
    workflows: ['gate-windows']
    types: [completed]
  # The reaper.  For the pull request whose verdict is late, lost, or was acted
  # on by a `decide` run that itself failed.  It does not merely report: it
  # finishes the job, then closes what it could not finish.
  schedule:
    # Every 10 minutes (was hourly at :17).  Both scheduled jobs below are idempotent and
    # mostly reads; the cost of running them often is a few API calls, the cost of running
    # them rarely was 1-2 lost lane rounds per self-locked pull request (2026-08-26: #57,
    # #61, #86, #91 - four in one day).
    - cron: '*/10 * * * *'
  workflow_dispatch:

# gate-windows triggers on BOTH `push` and `pull_request`, so one commit can
# produce two completed runs and two `decide` jobs racing on one pull request.
# They are serialised rather than cancelled: the loser must still be allowed to
# observe that the PR is already merged and exit cleanly.
concurrency:
  # workflow_run: one group per gate head sha (unchanged).  schedule/dispatch: ONE shared
  # group so a 10-minute tick never overlaps the previous tick's finish/reap pass.
  group: merge-claude-pr-${{ github.event.workflow_run.head_sha || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A pull request must carry this line in its BODY to be eligible.  The cloud
  # chief's prompt (v4) tells it to write the line; anything else is invisible.
  PF_MARKER: 'PF-AUTOMERGE: v4'
  # The one sentence the reaper says to a marked pull request sitting on a
  # branch none of this automation can see, and the string it greps its own
  # comments for so it says it exactly once.  ASCII only - the bridge console
  # is cp874 and lanes paste reap logs into it.
  PF_NONCLAUDE_NOTICE: 'invisible to automerge: re-push on a claude/ branch'
  # How long an unresolved claude/* pull request may live before the reaper ends
  # it.  Generous on purpose: a windows-latest gate takes tens of minutes and a
  # queued runner can wait, and killing a PR whose gate is merely slow would be
  # this file destroying the work it exists to land.
  PF_STALE_HOURS: '6'
  # How long a DRAFT specifically may sit before the reaper tries to un-stick
  # it with its own token, separate from and much shorter than PF_STALE_HOURS.
  # [KA1A-RECHECK 20260830_2151+07:00]: a lane round is under an hour, so a
  # draft still open past this many minutes is either a dead round or the
  # same agent-token 403 on un-drafting that pf_bridge already works around
  # (pf_bridge/.github/workflows/merge-claude-pr.yml:105, same value, same
  # reasoning: "recovers within the same hourly cycle").  This does NOT move
  # the close bound below -- PF_STALE_HOURS is untouched, on purpose, because
  # this repository's gate takes tens of minutes and a queued runner can
  # wait; only the "try `gh pr ready`" attempt moves earlier.
  # [PANYA-DECISION 20260904_1253+07:00] the value above was 45 until this
  # decision; the owner set both repositories to 75 so the un-draft attempt
  # stops firing in the middle of rounds that are still alive (a lane round
  # may run up to 90 minutes).  75 is her judgement, not a measurement: do
  # NOT cite pf_bridge#507 as evidence for it.  #507 was the opposite case -
  # a round that had FINISHED and could not un-draft itself, which argues for
  # un-drafting sooner - and nobody has measured a live round killed at 45.
  # There is no second cushion for the residual 76-90 minute round, whatever
  # a summary of that decision may say.  The marker filter (the `case "$BODY"`
  # guard in the reaper below) runs BEFORE the un-draft attempt, so a
  # markerless draft is never un-drafted at all; every pull request this
  # bound can act on therefore already carries the marker, which
  # PROCESS_GATES.md section 16 (marker before un-draft) guarantees.  A round
  # still working past 75 minutes with the marker already in its body can be
  # un-drafted here and merged on first green.  PROCESS_GATES.md section 22
  # narrows that window; it does not close it.  [pf-adversary, chief R338]
  PF_STALE_MINUTES: '75'
  # The job inside gate-windows.yml whose conclusion IS the gate verdict.  If
  # that job is ever renamed, this must be renamed with it, in the same commit.
  PF_GATE_JOB: 'gate'

jobs:
  # ==========================================================================
  # 1. A VERDICT ARRIVED.  Merge it or close it - never leave it open.
  # ==========================================================================
  decide:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # actions: read is REQUIRED - this job reads the GATE JOB's conclusion
      # via actions/runs/<id>/jobs, and listing a run's jobs needs it.
      # Without it the gh api call exits 1 and the job dies before deciding.
      # Measured 2026-08-20 ~21:5x: run #1 on pirate-force-server failed at
      # exactly that call.  reap looked green only because it had no pull
      # request to loop over, so it never reached the same call.
      #
      # actions: write is REQUIRED for the post-merge gate dispatch below, and
      # it INCLUDES read.  It is written ONCE.  R189 (a811d99, 2026-08-27)
      # added `actions: write` UNDER a still-present `actions: read`, and a
      # duplicated mapping key is accepted by yaml.safe_load but REJECTED by
      # GitHub's workflow validator: from that merge on, every push produced
      # a failed run named `.github/workflows/merge-claude-pr.yml` with zero
      # jobs, and decide/reap/schedule never ran again - every open PR became
      # a permanent lock.  Validate with a duplicate-key-strict loader.
      # GitHub does not start a workflow from a push made with GITHUB_TOKEN
      # (gate-windows.yml documents this same fact about itself) - so the
      # merge commit this job just pushed to the default branch would
      # otherwise NEVER get a gate verdict of its own. Measured 2026-08-27
      # by an attended GT-084 session: its boot-commit resolver had to reject
      # every merge commit for exactly this reason and fell back 14 commits
      # to the last commit that WAS separately gated, silently testing stale
      # code. workflow_dispatch is an explicit API call, not a token-authored
      # push event, so it is not subject to that same suppression.
      actions: write
    steps:
      - name: Merge on green, close on red, close on anything that goes wrong
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # NOT TRUSTED AS THE ONLY WAY TO FIND THE PULL REQUEST.  For a
          # pull_request-triggered run this is documented to be the head of the
          # PR branch rather than the ephemeral merge commit, but nobody here has
          # measured it, so the lookup below has a second path that does not rely
          # on it being right.  Recorded as an open question, not as a fact.
          SHA: ${{ github.event.workflow_run.head_sha }}
          # NOT the verdict.  The verdict is the `gate` job's conclusion, read
          # from the API below.  This is kept only for the log.
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # WHICH EVENT STARTED gate-windows.yml FOR THIS TREE -- 'push' or
          # 'pull_request' (gate-windows.yml:25/37).  THE ONE THING THIS RUN
          # MAY NOT DO ON A 'push' EVENT IS ACT: gate-windows.yml's checkout
          # has no `ref:`, so on `push` it tests the BARE BRANCH HEAD, and on
          # `pull_request` it tests `refs/pull/N/merge` -- the branch WITH
          # `main` merged in, the only tree AGENTS.md section 7 (0053/0149)
          # accepts as "ran the full suite".  Both runs finish independently
          # and `concurrency: cancel-in-progress: false` (above) lets them
          # race; whichever finishes first used to decide, event be damned.
          # [COO-DECISION 20260904_0550/0812/0848, chief R334 0812/0855
          # RETRACTED]: measured on server #696/#697 (2026-09-03 ~20:36/20:47
          # UTC) that in those two cases the RED `pull_request` run happened
          # to finish 3-4 minutes before the GREEN `push` run and so closed
          # both PRs first, with the `push` run's `decide` seeing `state !=
          # open` and exiting quietly -- but that ordering is runner-queue
          # timing, not a rule, and on a day the `push` runner is queued
          # first, its `decide` would merge a branch whose merge-with-main
          # tree was never run at all.
          #
          # [chief R335 audit, 2026-09-04, full method and coverage in the
          # round file]: THIS ALREADY HAPPENED, SIX TIMES, SINCE 2026-09-01.
          # #605, #578, #581, #590, #606, #668 were every one of them merged
          # by a GREEN `push`-triggered run 18-28 SECONDS after that run
          # finished, while the `pull_request`-triggered run for the exact
          # same head commit was still queued or running -- and every one of
          # those six `pull_request` runs came back RED 1-14 minutes later,
          # after the merge had already landed on `main`.  #668 is the
          # confirmed one: #670 ("R324b: main is red on the tick gate
          # landing") is this project's own cleanup PR for the breakage #668
          # caused.  This is not a hypothetical this fix pre-empts; it is a
          # bug this fix closes that had already put untested-tree code on
          # `main` six times before anyone noticed the mechanism.
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          # -- helpers ------------------------------------------------------
          # An API call that fails must never be indistinguishable from an API
          # call that returned nothing.  `|| true` on a gh call is how a reaper
          # dies quietly every hour while its log says it is fine.
          api() {
            local out rc
            out=$(gh api "$@" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::gh api $* FAILED (exit ${rc})" >&2
              echo "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          # Close a pull request, saying why.  Used on red, on conflict, and on
          # every failure of the merge itself - because a PR left open is the
          # one outcome this file may not produce.
          close_pr() {
            local pr="$1" head="$2" why="$3"
            gh pr comment "$pr" --repo "$REPO" --body "$why" || \
              echo "::warning::could not comment on #${pr} - closing it anyway"
            if gh pr close "$pr" --repo "$REPO"; then
              echo "  closed #${pr}; branch ${head} kept"
            else
              echo "::error::COULD NOT CLOSE #${pr}. The round lock is STUCK until a human closes it."
              return 1
            fi
          }

          echo "gate-windows run ${RUN_ID}: branch=${RUN_BRANCH} sha=${SHA} workflow_conclusion=${RUN_CONCLUSION}"

          # -- 1. the verdict, from the gate JOB and not from the run --------
          JOBS=$(api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")
          GATE=$(printf '%s' "$JOBS" | jq -r --arg n "$PF_GATE_JOB" \
                   '[.jobs[] | select(.name == $n)] | if length == 0 then "absent" else .[0].conclusion end')
          echo "job '${PF_GATE_JOB}' conclusion = ${GATE}"

          case "$GATE" in
            success)                      VERDICT=green ;;
            failure|cancelled|timed_out)  VERDICT=red ;;
            *)                            VERDICT=quiet ;;
          esac
          echo "verdict=${VERDICT}"
          if [ "$VERDICT" = "quiet" ]; then
            echo "'${GATE}' carries no verdict about this tree - every PR left untouched, reaper will follow up"
            exit 0
          fi

          # -- 1b. ONLY a 'pull_request' run may act on that verdict ---------
          # [COO-DECISION 20260904_0550 item 3 / 0848, chief R334 0812 RETRACTED
          # by 0855]: this run's tree depends on which event started it. A
          # 'push' event checks out the bare branch head; a 'pull_request'
          # event checks out `refs/pull/N/merge`, the branch WITH `main`
          # merged in -- the only tree AGENTS.md section 7 (0053/0149) accepts
          # as "ran the full suite". Both fire for the same commit and race
          # independently (concurrency above serialises them but does not
          # cancel either), so a 'push' run finishing first with GREEN, while
          # the 'pull_request' run for the SAME commit is still pending or is
          # RED, must never be allowed to merge or close anything: the tree it
          # tested is not the tree the house rules require, whichever run
          # happens to finish first. `finish` and `reap` below are unaffected
          # -- they act on 'schedule'/'workflow_dispatch' events, judged by
          # gate JOBS looked up fresh at their own run time, not by which
          # push/pull_request run woke them.
          if [ "$EVENT" != "pull_request" ]; then
            echo "this gate run was triggered by '${EVENT}', not 'pull_request' - REPORT ONLY, no merge, no close (see COO-DECISION 20260904_0550/0848). The pull_request-triggered run for this same commit is the one that may act."
            exit 0
          fi

          # -- 2. which pull requests is this commit the head of? ------------
          # Path one: ask GitHub directly.  Path two, if that returns nothing:
          # scan open pull requests for a matching head sha.  Two paths because
          # the meaning of workflow_run.head_sha on a pull_request event is the
          # one assumption in this file that has never been measured, and if it
          # is wrong the first path silently finds nothing at all.
          PRS=$(api "repos/${REPO}/commits/${SHA}/pulls" | jq -r '.[] | select(.state == "open") | .number')
          if [ -z "$PRS" ]; then
            echo "no open PR reported for ${SHA} - falling back to a scan of open pull requests"
            PRS=$(api "repos/${REPO}/pulls?state=open&per_page=100" \
                    | jq -r --arg s "$SHA" '.[] | select(.head.sha == $s) | .number')
          fi
          if [ -z "$PRS" ]; then
            echo "no open pull request has ${SHA} as its head - nothing to do"
            exit 0
          fi

          for PR in $PRS; do
            echo ""
            echo "--- pull request #${PR} ---"
            META=$(api "repos/${REPO}/pulls/${PR}")
            HEAD_REF=$(printf '%s' "$META"  | jq -r '.head.ref')
            HEAD_SHA=$(printf '%s' "$META"  | jq -r '.head.sha')
            HEAD_REPO=$(printf '%s' "$META" | jq -r '.head.repo.full_name // ""')
            BASE_REF=$(printf '%s' "$META"  | jq -r '.base.ref')
            BODY=$(printf '%s' "$META"      | jq -r '.body // ""')
            DRAFT=$(printf '%s' "$META"     | jq -r '.draft')
            STATE=$(printf '%s' "$META"     | jq -r '.state')

            # Six gates, every one of them fail-closed.  A pull request that
            # fails any of them is not eligible, is NOT the round lock, and is
            # left completely alone - not merged, not closed, not commented on.
            [ "$STATE" = "open" ]        || { echo "  no longer open - skipped"; continue; }
            [ "$DRAFT" = "false" ]       || { echo "  draft - skipped"; continue; }
            # Same-repository only.  A fork can choose its own branch name and
            # its own PR body, so `claude/*` plus the marker are attacker-chosen
            # on a fork PR and prove nothing at all.  This line is what stops
            # anyone on the internet from merging into main by opening a PR.
            [ "$HEAD_REPO" = "$REPO" ]   || { echo "  head repo '${HEAD_REPO}' is not ${REPO} (fork) - skipped"; continue; }
            [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || { echo "  base '${BASE_REF}' is not ${DEFAULT_BRANCH} - skipped"; continue; }
            case "$HEAD_REF" in
              claude/*) : ;;
              *) echo "  head '${HEAD_REF}' is not a claude/ branch - skipped"; continue ;;
            esac
            case "$BODY" in
              *"$PF_MARKER"*) : ;;
              *) echo "  body has no marker '${PF_MARKER}' - skipped, ON PURPOSE"; continue ;;
            esac
            # The verdict has to be about the commit that would actually merge.
            if [ "$HEAD_SHA" != "$SHA" ]; then
              echo "  head moved (${HEAD_SHA} != ${SHA}) - this verdict is about an older commit, skipped"
              continue
            fi

            if [ "$VERDICT" = "red" ]; then
              close_pr "$PR" "$HEAD_REF" "$(printf '%s\n' \
                "**Gate RED (job \`${PF_GATE_JOB}\` = \`${GATE}\`) - closing this pull request.**" \
                "" \
                "Run: ${RUN_URL}  --  Commit: \`${SHA}\`" \
                "" \
                "Closed automatically by \`.github/workflows/merge-claude-pr.yml\`, and the reason is the lock rather than the work. An open \`claude/*\` pull request is what stops two cloud rounds running at once; a red one left open would stop **every** later round, forever, and no later round could repair it, because a session may only push its own branch." \
                "" \
                "**The branch \`${HEAD_REF}\` is kept and nothing on it is lost.** Start again from \`main\` in a later round; if these commits are worth recovering, recover them from that branch by hand.")"
              continue
            fi

            # -- green ------------------------------------------------------
            # `mergeable` is computed asynchronously and is null until ready.
            MERGEABLE=null
            for attempt in 1 2 3 4 5 6; do
              MERGEABLE=$(api "repos/${REPO}/pulls/${PR}" | jq -r '.mergeable')
              [ "$MERGEABLE" = "null" ] || break
              echo "  mergeable not computed yet (attempt ${attempt}) - waiting"
              sleep 5
            done

            if [ "$MERGEABLE" != "true" ]; then
              close_pr "$PR" "$HEAD_REF" "$(printf '%s\n' \
                "**Gate GREEN, but this pull request does not merge cleanly (\`mergeable=${MERGEABLE}\`) - closing it.**" \
                "" \
                "Run: ${RUN_URL}  --  Commit: \`${SHA}\`" \
                "" \
                "\`main\` moved underneath this branch and the two disagree line by line. A cloud round cannot rebase this branch - it can only push its own - so leaving this open would leave the round lock stuck." \
                "" \
                "**The branch \`${HEAD_REF}\` is kept.** Redo the work on a branch cut from current \`main\`." \
                "" \
                "If this keeps happening to the same file, the file is the defect and not the round: two writers appending to one line of one document collide forever. Give each round its own file and index it.")"
              continue
            fi

            # A merge commit, not a squash: the commit messages in this project
            # are the record, several hundred words each.  --match-head-commit
            # makes GitHub refuse if the head moved since the check above.
            #
            # `|| true` is CORRECT here and nowhere else in this file: the merge
            # is allowed to fail, and what follows is the handling of that
            # failure.  Under `set -e` without it, a lost race would kill this
            # script with the pull request still open - which is the one thing
            # this file may not do.
            # "Base branch was modified" is a transient race with the Windows sync, which commits
            # to main every few minutes; measured 2026-08-27 13:22 (+07:00) on pf_bridge #197 and
            # earlier on #163-#166. Retry a few times before treating it as a real failure.
            MRC=1; MERGE_OUT=""
            for mtry in 1 2 3 4 5; do
              MERGE_OUT=$(gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$SHA" 2>&1) && MRC=0 || MRC=$?
              [ "$MRC" -eq 0 ] && break
              case "$MERGE_OUT" in
                *"Base branch was modified"*|*"base branch was modified"*) echo "  merge> base moved under us (try ${mtry}) - waiting 15s"; sleep 15 ;;
                *) break ;;
              esac
            done
            printf '%s\n' "$MERGE_OUT" | sed 's/^/  merge> /'

            if [ "$MRC" -eq 0 ]; then
              echo "  GREEN -> merged"
              # Only after a merge, never after a close.  Safe because the fork
              # check above guarantees HEAD_REF names a branch in THIS repo.
              api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" >/dev/null 2>&1 \
                && echo "  branch ${HEAD_REF} deleted" \
                || echo "  branch ${HEAD_REF} not deleted (already gone?) - harmless"
              # The merge commit this push just created on the default branch
              # will not trigger gate-windows.yml on its own (GITHUB_TOKEN push
              # events do not start other workflows) - so it never gets a
              # verdict unless asked for one explicitly. Non-fatal: a failure
              # here must not turn a real merge into a closed PR.
              gh workflow run gate-windows.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
                && echo "  gate-windows dispatched on ${DEFAULT_BRANCH}" \
                || echo "::warning::could not dispatch gate-windows on ${DEFAULT_BRANCH} - the merge commit may be untested until someone dispatches it by hand"
              continue
            fi

            # The merge failed on a green gate.  Common and harmless: another
            # `decide` run merged it a second earlier.  Uncommon and serious:
            # HTTP 403, meaning `pull-requests: write` was refused on this
            # repository - the one permission nobody has measured.  Either way
            # the pull request may not be left open.
            # One read, three facts.  DECIDE ON THE SHA, NOT ON THE ERROR TEXT:
            # the wording is GitHub's and may drift, while "did the head move?"
            # is the actual question - and the SHA test also REFUSES to skip when
            # the head did NOT move, so a 403 or any other real failure still
            # reaches the close path even if its text happens to mention a head.
            META2=$(api "repos/${REPO}/pulls/${PR}")
            STATE=$(printf '%s' "$META2" | jq -r '.state')
            NOW_SHA=$(printf '%s' "$META2" | jq -r '.head.sha')
            CREATED=$(printf '%s' "$META2" | jq -r '.created_at')
            if [ "$STATE" != "open" ]; then
              echo "  merge failed but the PR is already ${STATE} - another run got there first, fine"
              continue
            fi

            # THE HEAD MOVED WHILE WE WERE DECIDING.  This is the SAME condition
            # as the `HEAD_SHA != SHA` check above - which leaves the pull
            # request open and skips - only detected seconds later, after the
            # `mergeable` poll (up to 30s of sleep) and the base-moved retry loop
            # (up to 60s more) gave the round time to push again.  The two must
            # be handled the SAME way; closing here was an inconsistency, not a
            # decision.
            #
            # BOUNDED BY AGE, and the bound is the point.  Left unbounded, a skip
            # here converts a bounded loss (one closed round) into an unbounded
            # one: anything that keeps pushing would hold the round lock while
            # every later round ended on sight.  Younger than PF_STALE_HOURS: a
            # live round, leave it for the gate its new head will get.  Older and
            # still moving: close it, whatever is moving it.  THAT IS THE ANSWER
            # TO "how long may this skip hold the lock" - PF_STALE_HOURS,
            # enforced here in code rather than asserted in a comment.
            #
            # This is the ONE exception to the invariant at the top of this file,
            # and it is stated there too.  It is not the "escape hatch that
            # reports rather than acts": it acts by handing the decision to the
            # gate the new head is already getting, and it hands it back to the
            # close path the moment the bound is exceeded.  Note the asymmetry
            # with pf_bridge: there `reap` itself had to be bounded because it is
            # that repo's only reaper, while here `reap` still closes on a moved
            # head unconditionally, so this repository keeps a hard backstop.
            #
            # MEASURED 2026-08-28 18:27:54 UTC, pirate-force-server #218: the
            # round's own `wake gate:` empty commit (chief prompt v6.2, section
            # 3 step 4) landed 6 seconds before this merge call, GitHub answered
            # "Head branch was modified", and a GREEN round - the COO-ordered
            # reconnection of the production_allowed kill switch - was closed
            # and lost from `main` for 7 hours until R219 recovered it by hand.
            CSEC=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
            AGE=$(( $(date -u +%s) - CSEC ))
            LIMIT=$(( PF_STALE_HOURS * 3600 ))
            if [ "$NOW_SHA" != "$SHA" ] && [ "$AGE" -lt "$LIMIT" ]; then
              echo "::warning::#${PR} left open - head moved ${SHA} -> ${NOW_SHA} at age $(( AGE / 60 ))m (bound ${PF_STALE_HOURS}h)"
              echo "  the gate for the new head decides it; finish/reap are the backstop"
              continue
            fi
            echo "::warning::merge of #${PR} failed on a GREEN gate (exit ${MRC}) - closing it to release the round lock"
            close_pr "$PR" "$HEAD_REF" "$(printf '%s\n' \
              "**Gate GREEN, but the merge call failed - closing this pull request to release the round lock.**" \
              "" \
              "Run: ${RUN_URL}  --  Commit: \`${SHA}\`" \
              "" \
              '```' \
              "${MERGE_OUT}" \
              '```' \
              "" \
              "**If that text mentions HTTP 403, this repository is refusing \`pull-requests: write\` to \`GITHUB_TOKEN\`, and no pull request will ever merge here until a setting changes.** That is a configuration fault, not a fault in the work: \`.github/workflows/merge-claude-pr.yml\` is doing exactly what it was told. Check Settings -> Actions -> General -> Workflow permissions." \
              "" \
              "**The branch \`${HEAD_REF}\` is kept and its commits are green.**")"
          done

  # ==========================================================================
  # 2. THE REAPER.  It FINISHES what `decide` did not - it does not report it.
  # ==========================================================================
  # Every case where `decide` never ran, or ran and failed, arrives here: a gate
  # that never triggered, a runner that vanished, a `decide` job that died
  # between merging and closing.  A first draft of this job found "green gate,
  # PR still open" and merely printed a warning - which is a permanent lock
  # dressed up as diligence.  It now tries the merge itself, and closes the pull
  # request when it cannot.
  # ---------------------------------------------------------------------------
  # finish: the missing wake-up.  `decide` runs only on workflow_run, i.e. when a
  # gate FINISHES.  A pull request whose gate finished while it was still a draft
  # is skipped ("draft - skipped"), and when the round then marks it ready no
  # event ever re-runs `decide`.  The PR sits green-and-ready until the 6-hour
  # reaper, and every later round of that lane ends on "lock held" (measured on
  # 2026-08-26: #57 13:25-14:49, #61 15:59-17:27, #86 04:2x-05:2x, #91 05:3x-07:19).
  # This job closes that gap: on every schedule tick it merges any pull request
  # that is eligible, non-draft, GREEN on its current head, and has no live run.
  # It never closes anything and never touches drafts - it is `decide`'s green
  # path, replayed for pull requests `decide` was never woken for.
  finish:
    # Runs on EVERY event, after decide.  Measured 2026-08-27 11:05 +07:00:
    # GitHub had fired this repository's hourly schedule only five times in
    # the whole of 2026-08-26 (05:58, 08:24, 11:02, 14:08, 16:58 UTC) and not
    # once in the eleven hours after that - the */10 schedule below never
    # fired at all in its first 90 minutes.  A cron that does not tick is not
    # a safety net.  What DOES happen several times an hour is a gate
    # finishing (workflow_run), so the sweep rides on that instead: every
    # gate completion sweeps every open pull request.  Idempotent - a second
    # sweep finds nothing left to do; a merge lost to a race is "already
    # closed - fine", never a close.
    needs: decide
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge every green, ready, eligible claude/* pull request that decide was never woken for
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          api() {
            local out rc
            out=$(gh api "$@" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::gh api $* FAILED (exit ${rc})" >&2
              echo "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }
          OPEN=$(api "repos/${REPO}/pulls?state=open&per_page=100" | jq -r '.[].number')
          if [ -z "$OPEN" ]; then echo "no open pull requests"; exit 0; fi
          for PR in $OPEN; do
            META=$(api "repos/${REPO}/pulls/${PR}")
            HEAD_REF=$(printf '%s' "$META"  | jq -r '.head.ref')
            HEAD_SHA=$(printf '%s' "$META"  | jq -r '.head.sha')
            HEAD_REPO=$(printf '%s' "$META" | jq -r '.head.repo.full_name // ""')
            BASE_REF=$(printf '%s' "$META"  | jq -r '.base.ref')
            BODY=$(printf '%s' "$META"      | jq -r '.body // ""')
            DRAFT=$(printf '%s' "$META"     | jq -r '.draft')
            echo ""
            echo "--- #${PR} ${HEAD_REF} draft=${DRAFT} ---"
            # Same six eligibility gates as decide, fail-closed, in the same order.
            [ "$DRAFT" = "false" ]       || { echo "  draft - left alone (the round is still working)"; continue; }
            [ "$HEAD_REPO" = "$REPO" ]   || { echo "  fork - skipped"; continue; }
            [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || { echo "  base is not ${DEFAULT_BRANCH} - skipped"; continue; }
            case "$HEAD_REF" in claude/*) : ;; *) echo "  not a claude/ branch - skipped"; continue ;; esac
            case "$BODY" in *"$PF_MARKER"*) : ;; *) echo "  body has no marker '${PF_MARKER}' - skipped, ON PURPOSE (a human must add it; see #86 2026-08-27)"; continue ;; esac
            # Verdict for THIS head only.  Any live PULL_REQUEST-triggered run
            # = decide will handle it; do not race.  ONLY 'pull_request' runs
            # count here -- same reason as the EVENT gate in the `decide` job
            # above (COO-DECISION 20260904_0550/0848): a 'push' run tests the
            # bare branch head, not the refs/pull/N/merge tree AGENTS.md
            # section 7 requires, and this loop used to break on the FIRST
            # green run it found regardless of which event produced it, so a
            # green 'push' run could finish this PR even while the
            # 'pull_request' run for the same commit was red or still queued.
            RUNS=$(api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")
            LIVE=$(printf '%s' "$RUNS" | jq '[.workflow_runs[] | select(.name == "gate-windows" and .event == "pull_request" and .status != "completed")] | length')
            if [ "$LIVE" != "0" ]; then echo "  a gate run is still live - left to decide"; continue; fi
            GREEN=no
            for RID in $(printf '%s' "$RUNS" | jq -r '.workflow_runs[] | select(.name == "gate-windows" and .event == "pull_request") | .id'); do
              C=$(api "repos/${REPO}/actions/runs/${RID}/jobs?per_page=100" \
                    | jq -r --arg n "$PF_GATE_JOB" '[.jobs[] | select(.name == $n)] | if length == 0 then "absent" else .[0].conclusion end')
              [ "$C" = "success" ] && { GREEN=yes; break; } || true
            done
            [ "$GREEN" = "yes" ] || { echo "  no green pull_request-triggered gate on head ${HEAD_SHA} - left alone (red is decide's/reap's call, not finish's)"; continue; }
            # mergeable is computed asynchronously.
            MERGEABLE=null
            for attempt in 1 2 3 4 5 6; do
              MERGEABLE=$(api "repos/${REPO}/pulls/${PR}" | jq -r '.mergeable')
              [ "$MERGEABLE" = "null" ] || break
              sleep 5
            done
            [ "$MERGEABLE" = "true" ] || { echo "  mergeable=${MERGEABLE} - left alone (conflict handling is reap's job)"; continue; }
            echo "  green + ready + eligible and decide never ran for this head -> merging"
            # "Base branch was modified" is a transient race with the Windows sync, which commits
            # to main every few minutes; measured 2026-08-27 13:22 (+07:00) on pf_bridge #197 and
            # earlier on #163-#166. Retry a few times before treating it as a real failure.
            MRC=1; MERGE_OUT=""
            for mtry in 1 2 3 4 5; do
              MERGE_OUT=$(gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA" 2>&1) && MRC=0 || MRC=$?
              [ "$MRC" -eq 0 ] && break
              case "$MERGE_OUT" in
                *"Base branch was modified"*|*"base branch was modified"*) echo "  merge> base moved under us (try ${mtry}) - waiting 15s"; sleep 15 ;;
                *) break ;;
              esac
            done
            printf '%s\n' "$MERGE_OUT" | sed 's/^/  merge> /'
            if [ "$MRC" -eq 0 ]; then
              echo "  FINISHED -> merged #${PR}"
              api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" >/dev/null 2>&1 \
                && echo "  branch ${HEAD_REF} deleted" || echo "  branch not deleted - harmless"
              gh workflow run gate-windows.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
                && echo "  gate-windows dispatched on ${DEFAULT_BRANCH}" \
                || echo "::warning::could not dispatch gate-windows on ${DEFAULT_BRANCH}"
            else
              echo "::warning::merge of #${PR} failed (exit ${MRC}) - left open for reap to judge"
            fi
          done

  reap:
    # Same reason as finish: rides on every event, after finish, because the
    # schedule cannot be relied on to tick.  Its own threshold (PF_STALE_HOURS)
    # keeps it from acting on anything young.
    needs: [decide, finish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # actions: read is REQUIRED - this job reads the GATE JOB's conclusion
      # via actions/runs/<id>/jobs, and listing a run's jobs needs it.
      # Without it the gh api call exits 1 and the job dies before deciding.
      # Measured 2026-08-20 ~21:5x: run #1 on pirate-force-server failed at
      # exactly that call.  reap looked green only because it had no pull
      # request to loop over, so it never reached the same call.
      # actions: write INCLUDES read and is written ONCE - see the `decide`
      # job's permissions block for the duplicate-key incident.
      actions: write
    steps:
      - name: Finish or close every stale claude/* pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          api() {
            local out rc
            out=$(gh api "$@" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::gh api $* FAILED (exit ${rc})" >&2
              echo "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          NOW=$(date -u +%s)
          LIMIT=$(( PF_STALE_HOURS * 3600 ))
          LIMIT2=$(( PF_STALE_MINUTES * 60 ))
          echo "reaping eligible claude/* pull requests older than ${PF_STALE_HOURS}h (draft ready-attempt at ${PF_STALE_MINUTES}m)"

          OPEN=$(api "repos/${REPO}/pulls?state=open&per_page=100" | jq -r '.[].number')
          if [ -z "$OPEN" ]; then echo "no open pull requests"; exit 0; fi

          for PR in $OPEN; do
            META=$(api "repos/${REPO}/pulls/${PR}")
            HEAD_REF=$(printf '%s' "$META"  | jq -r '.head.ref')
            HEAD_SHA=$(printf '%s' "$META"  | jq -r '.head.sha')
            HEAD_REPO=$(printf '%s' "$META" | jq -r '.head.repo.full_name // ""')
            BASE_REF=$(printf '%s' "$META"  | jq -r '.base.ref')
            BODY=$(printf '%s' "$META"      | jq -r '.body // ""')
            CREATED=$(printf '%s' "$META"   | jq -r '.created_at')
            DRAFT=$(printf '%s' "$META"     | jq -r '.draft')

            [ "$HEAD_REPO" = "$REPO" ] || continue
            [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || continue
            # [COO-DECISION 20260905_0847 item 4, option (a); chief round pv4zg1]
            # A head that is not `claude/*` is invisible to `decide`, `finish`
            # and this reaper, marker or no marker.  The gate stays exactly as
            # it is - two strings a stranger can write must never buy a merge -
            # but it stops being SILENT: #794 was gate-green at 05:53 and was
            # neither merged nor closed for 2.5 hours with no signal anywhere.
            # Say it once, where its author is looking, and change nothing else.
            case "$HEAD_REF" in
              claude/*) : ;;
              *)
                # No marker = nobody asked for a merge = nothing surprising is
                # happening to this pull request.  Stay quiet, as before.
                case "$BODY" in *"$PF_MARKER"*) : ;; *) continue ;; esac
                SAID=$(api "repos/${REPO}/issues/${PR}/comments?per_page=100" \
                       | jq -r --arg s "$PF_NONCLAUDE_NOTICE" \
                              '[.[] | select((.body // "") | contains($s))] | length') || SAID=""
                if [ -z "$SAID" ]; then
                  echo "::warning::#${PR} ${HEAD_REF}: marked but not a claude/ branch - could not read its comments, saying nothing this sweep"
                elif [ "$SAID" != "0" ]; then
                  echo "--- #${PR} ${HEAD_REF}: marked but not a claude/ branch - already told once, left alone"
                else
                  api "repos/${REPO}/issues/${PR}/comments" \
                      -f "body=**${PF_NONCLAUDE_NOTICE}**"$'\n\n'"This pull request carries \`${PF_MARKER}\` but its head branch is \`${HEAD_REF}\`, and \`decide\`, \`finish\` and this reaper all skip every head that does not start with \`claude/\`. Nothing will merge it and nothing will close it, so it would otherwise sit here green and silent - that is exactly what happened to #794 for 2.5 hours."$'\n\n'"Push the same commits to the branch this session was given (\`claude/...\`) and open the pull request from there. Nobody on the team should close or merge this one for you - AGENTS.md section 7." \
                      >/dev/null \
                    && echo "--- #${PR} ${HEAD_REF}: marked but not a claude/ branch - commented once, left open ON PURPOSE" \
                    || echo "::warning::#${PR} ${HEAD_REF}: marked but not a claude/ branch - comment failed, left open"
                fi
                continue
                ;;
            esac
            case "$BODY" in *"$PF_MARKER"*) : ;; *) continue ;; esac

            # A `date` that cannot parse the timestamp must not kill the loop and
            # leave every later pull request unreaped.  Default to age 0: the
            # cost of skipping one round is one hour; the cost of aborting the
            # reaper is the lock.
            CSEC=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW")
            AGE=$(( NOW - CSEC ))
            echo ""
            echo "--- #${PR} ${HEAD_REF} draft=${DRAFT} age=$(( AGE / 3600 ))h ---"

            # Early un-stick attempt for a stale DRAFT, at PF_STALE_MINUTES
            # rather than PF_STALE_HOURS -- see the env block above for why.
            # This can fire on every schedule/workflow_run tick once a draft
            # crosses PF_STALE_MINUTES; a successful `gh pr ready` is a no-op on
            # later ticks because the PR is then non-draft and this branch is
            # skipped.  Does not close anything and does not touch the
            # PF_STALE_HOURS bound below.
            READY_ATTEMPTED=""
            if [ "$DRAFT" = "true" ] && [ "$AGE" -ge "$LIMIT2" ]; then
              READY_ATTEMPTED=yes
              if gh pr ready "$PR" --repo "$REPO" 2>&1 | sed 's/^/  ready> /'; then
                echo "  stale draft (>${PF_STALE_MINUTES}m) -> marked ready; the next event runs decide normally"
                continue
              fi
              echo "  could not mark ready at ${PF_STALE_MINUTES}m (token refused it too) - leaving for the ${PF_STALE_HOURS}h close bound"
            fi

            [ "$AGE" -ge "$LIMIT" ] || { echo "  young enough - left alone"; continue; }

            # [MEASURED, 2026-08-30, pf_bridge#507, ka1-A]: a round can finish
            # clean and push real work, then find BOTH the REST `draft:false`
            # PATCH and the GraphQL `markPullRequestReadyForReview` mutation
            # rejected (403) for the agent's own token.  Before this repo's
            # `decide` job ever sees such a pull request it stays draft on
            # the agent's side; without a check here it would only ever leave
            # draft by falling through to the generic "no gate verdict" close
            # path below, on an attempted `gh pr merge` that is guaranteed to
            # fail because the API refuses to merge a draft.
            #
            # [PROPOSED, UNTESTED, pf-adversary round `bunu7v`]: the fix below
            # -- try this workflow's own `${{ github.token }}` for `gh pr
            # ready` before treating a stale draft as dead -- has NOT been
            # observed to succeed anywhere yet.  pf_bridge#507 itself was
            # undrafted by the OWNER clicking "Ready for review" on
            # github.com, not by any workflow call, so it is evidence the
            # AGENT's token was refused, not evidence this WORKFLOW's token
            # is accepted.  `gh pr ready` calls the same
            # `markPullRequestReadyForReview` mutation that 403'd for the
            # agent -- if the 403's root cause is a policy that blocks any
            # bot-identity actor from that one mutation specifically, this
            # call 403s too and the block below silently degrades to a no-op:
            # one extra failed API call in front of the same eventual close,
            # not a fix.  Nobody has yet root-caused why the agent's token
            # was refused (see the source letter's own nonclaims).  Get one
            # real observation of this call succeeding under
            # `${{ github.token }}` before trusting that it closes the hole;
            # until then this is strictly no WORSE than the pre-patch
            # behavior (a reversible "try ready" ahead of an unconditional
            # close), which is why it ships anyway.
            # READY_ATTEMPTED may already be "yes" from the PF_STALE_MINUTES
            # attempt above; this is a final retry immediately before the
            # close path below, in case the owner clicked "Ready for review"
            # or a permissions fix landed between the PF_STALE_MINUTES attempt and now.
            if [ "$DRAFT" = "true" ]; then
              READY_ATTEMPTED=yes
              if gh pr ready "$PR" --repo "$REPO" 2>&1 | sed 's/^/  ready> /'; then
                echo "  stale draft -> marked ready; the next event runs decide normally"
                continue
              fi
              echo "  could not mark ready (token refused it too, or the fix does not work - see comment above) - falling through to the gate-verdict close path"
            fi

            RUNS=$(api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")
            LIVE=$(printf '%s' "$RUNS" | jq '[.workflow_runs[] | select(.name == "gate-windows" and .event == "pull_request" and .status != "completed")] | length')
            if [ "$LIVE" != "0" ]; then echo "  a pull_request-triggered gate run is still live - left alone, decide will handle it"; continue; fi

            # Did the GATE JOB pass on this head?  Not the workflow: the job.
            # ONLY the 'pull_request'-triggered run counts (COO-DECISION
            # 20260904_0550/0848) -- see the same guard in `decide` and
            # `finish` above for why a 'push' run's green must never finish
            # or reap a pull request here.
            GREEN=no
            for RID in $(printf '%s' "$RUNS" | jq -r '.workflow_runs[] | select(.name == "gate-windows" and .event == "pull_request") | .id'); do
              C=$(api "repos/${REPO}/actions/runs/${RID}/jobs?per_page=100" \
                    | jq -r --arg n "$PF_GATE_JOB" '[.jobs[] | select(.name == $n)] | if length == 0 then "absent" else .[0].conclusion end')
              echo "  run ${RID}: job ${PF_GATE_JOB} = ${C}"
              [ "$C" = "success" ] && { GREEN=yes; break; } || true
            done

            if [ "$GREEN" = "yes" ]; then
              echo "  a GREEN gate exists and this PR is still open - decide must have failed; finishing it here"
              if gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"; then
                echo "  merged by the reaper"
                api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" >/dev/null 2>&1 \
                  && echo "  branch ${HEAD_REF} deleted" || echo "  branch not deleted - harmless"
                gh workflow run gate-windows.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
                  && echo "  gate-windows dispatched on ${DEFAULT_BRANCH}" \
                  || echo "::warning::could not dispatch gate-windows on ${DEFAULT_BRANCH} - the merge commit may be untested until someone dispatches it by hand"
                continue
              fi
              REASON="$(printf '%s\n' \
                "**The gate is GREEN for \`${HEAD_SHA}\`, but this pull request could not be merged - closing it.**" \
                "" \
                "The reaper tried the merge itself after \`decide\` left this open for more than ${PF_STALE_HOURS} hours, and the merge was refused. If this pull request was still a draft, that refusal is expected -- the API will not merge a draft -- and is unrelated to any \`GITHUB_TOKEN\` permission; otherwise, if the run log of this job shows HTTP 403, this repository is refusing \`pull-requests: write\` to \`GITHUB_TOKEN\` and nothing will ever merge here until a setting changes." \
                "" \
                "$( [ "$READY_ATTEMPTED" = "yes" ] && printf '%s\n\n' "This reap job also tried \`gh pr ready\` with its own token before this merge attempt, in case the round had actually finished and only the agent's token was refused to un-draft it; that call failed too." )" \
                "**The branch \`${HEAD_REF}\` is kept and its commits are green.**")"
            else
              REASON="$(printf '%s\n' \
                "**No gate verdict has arrived in ${PF_STALE_HOURS} hours - closing this pull request.**" \
                "" \
                "Commit: \`${HEAD_SHA}\`. No run of \`gate-windows\` for that commit is queued, running, or finished with job \`${PF_GATE_JOB}\` green." \
                "" \
                "$( [ "$READY_ATTEMPTED" = "yes" ] && printf '%s\n\n' "This pull request was still a draft; this reap job tried \`gh pr ready\` with its own token first, in case the round had actually finished and only the agent's token was refused to un-draft it, and that call failed too -- so this is a genuine stale draft, not a token-permission artifact." )" \
                "An open \`claude/*\` pull request is the cloud chief's round lock. One waiting on a verdict that will never come is a lock nobody can release, so this reaper releases it. **The branch \`${HEAD_REF}\` is kept.**" \
                "" \
                "If gate runs are missing rather than slow, the fault is upstream of this pull request - Actions disabled, out of minutes, or a workflow that never triggered - and closing pull requests will not fix it.")"
            fi

            # [PANYA-DECISION 20260901_0920+07:00, via ka1-A] item 3, applied to
            # both repos: a truly dead round is completely silent, so measure
            # that instead of guessing from age alone.  A commit on this exact
            # head within the last ~30 minutes means a round is still actively
            # working even though the age/verdict checks above say close it --
            # do not discard live work.  Only guards the age-based "assume
            # dead" close path here; a hard `mergeable=false`/red-gate close
            # elsewhere in this file is a fact, not a guess, and is not gated
            # on this.
            # [pf-adversary, this round]: BOUNDED, same as every other "leave
            # open" skip in this file (see the invariant comment at the top,
            # and `decide`'s own head-moved skip).  Past
            # LIVENESS_ABSOLUTE_LIMIT the reprieve stops applying no matter
            # what keeps touching the branch, so a stuck retry loop or an
            # orphaned watchdog on a dead round's own branch cannot hold the
            # lock forever by refreshing itself faster than the 30-minute
            # liveness window.
            LIVENESS_WINDOW_SEC=1800
            LIVENESS_ABSOLUTE_LIMIT=$(( LIMIT * 2 ))
            if [ "$AGE" -lt "$LIVENESS_ABSOLUTE_LIMIT" ]; then
              # The commits/ lookup must never be able to kill this whole
              # tick under `set -e` on a transient API failure: `|| true` on
              # `api` itself is not enough because `jq` still runs on
              # whatever (possibly empty) stdout it left, and pipefail would
              # then still fail the assignment.  Guard the entire command
              # substitution instead, same fail-safe direction as the CSEC3
              # parse fallback below (a lookup failure here must fall through
              # to "no liveness signal", not abort the loop).
              LATEST_COMMIT_DATE=$(api "repos/${REPO}/commits/${HEAD_SHA}" 2>/dev/null | jq -r '.commit.committer.date // empty' 2>/dev/null) || LATEST_COMMIT_DATE=""
              if [ -n "$LATEST_COMMIT_DATE" ]; then
                CSEC3=$(date -u -d "$LATEST_COMMIT_DATE" +%s 2>/dev/null || echo 0)
                SINCE_PUSH=$(( NOW - CSEC3 ))
                if [ "$CSEC3" -ne 0 ] && [ "$SINCE_PUSH" -ge 0 ] && [ "$SINCE_PUSH" -lt "$LIVENESS_WINDOW_SEC" ]; then
                  echo "::warning::#${PR} left open - head ${HEAD_SHA} committed $(( SINCE_PUSH / 60 ))m ago (<30m) - round looks alive, not reaping yet (absolute bound $(( LIVENESS_ABSOLUTE_LIMIT / 3600 ))h)"
                  continue
                fi
              fi
            else
              echo "  past the liveness reprieve's own absolute bound ($(( LIVENESS_ABSOLUTE_LIMIT / 3600 ))h) - closing regardless of recent activity"
            fi

            gh pr comment "$PR" --repo "$REPO" --body "$REASON" || \
              echo "::warning::could not comment on #${PR} - closing it anyway"
            if gh pr close "$PR" --repo "$REPO"; then
              echo "  REAPED -> closed; branch ${HEAD_REF} kept"
            else
              echo "::error::COULD NOT CLOSE #${PR}. The round lock is STUCK until a human closes it."
            fi
          done
